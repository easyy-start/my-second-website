<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Adventure Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <!-- 【上階】映像エリア（ここで背景画像と当たり判定を管理） -->
        <div id="screen-area" style="position: relative; width: 100%; height: 600px; background-size: cover; background-position: center;">
            <!-- 当たり判定レイヤー -->
            <div id="hotspots-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;"></div>
            
            <!-- スタートボタン（映像の真ん中に出したいのでここに配置） -->
            <button id="start-button">GAME START</button>
        </div>
    
        <!-- 【下階】テキストエリア（真っ黒な背景にして絵と被らないようにする） -->
        <div id="ui-layer" style="position: relative; width: 100%; height: 200px; background-color: #111; border-top: 4px solid #555; box-sizing: border-box; display: none;">
            <!-- キャラ名やセリフ、選択肢のタグは今まで通りここに置く -->
            <h3 id="character-name" style="margin: 0; color: #ffcc00;"></h3>
            <p id="dialogue-text" style="color: #fff; font-size: 18px;"></p>
            <div id="choices-container"></div>
            <button id="next-button">次へ</button>
        </div>
        <div id="password-container" style="display: none; margin-top: 15px;">
            <input type="text" id="password-input" placeholder="パスワードを入力..." style="font-size: 18px; padding: 5px; width: 200px; background-color: #333; color: #fff; border: 1px solid #777;">
            <button id="password-submit" style="font-size: 18px; padding: 5px 15px; cursor: pointer;">解除</button>
        </div>

        
    </div>

    <script src="script.js"></script>
</body>
</html>
