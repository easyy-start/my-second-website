<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Adventure Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- ゲーム開始前画面 -->
        <button id="start-button">ゲームを開始する</button>

        <!-- 会話UI -->
        <div id="ui-layer" style="display: none;">
            <div id="dialogue-window">
                <div id="character-name"></div>
                <div id="dialogue-text"></div>
                
                <!-- 選択肢コンテナ -->
                <div id="choices-container"></div>
                <!-- 次へボタン -->
                <button id="next-button">▼</button>
            </div>
        </div>
    </div>

    <!-- 1. ゲーム画面の枠（ここを座標の基準にする設定：relative） -->
    <div id="game-container" style="position: relative; width: 800px; height: 600px; background-image: url('images/bg_door.png');">
    
        <!-- 2. クリックできる透明なエリア（座標を指定して配置：absolute） -->
        <!-- 例：ドアノブの周辺だけをクリック可能にする -->
        <div id="hotspot-door" style="
            position: absolute;
            top: 300px;   /* 上からの位置 */
            left: 450px;  /* 左からの位置 */
            width: 80px;  /* クリック判定の幅 */
            height: 80px; /* クリック判定の高さ */
            cursor: pointer; /* マウスを乗せると指マークになる */
            border: 2px solid red; /* ★開発中は赤枠を表示して場所を調整！ */
        " onclick="clickDoor()"></div>
    
    </div>


    
    <script src="script.js"></script>
</body>
</html>
