<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Adventure Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- ゲーム開始前画面 -->
        <button id="start-button">ゲームを開始する</button>

        <!-- 会話UI -->
        <div id="ui-layer" style="display: none;">
            <div id="dialogue-window">
                <div id="character-name"></div>
                <div id="dialogue-text"></div>
                
                <!-- 選択肢コンテナ -->
                <div id="choices-container"></div>
                <!-- 次へボタン -->
                <button id="next-button">▼</button>
            </div>
        </div>
    </div>

    <!-- 具体例：背景の上に透明なクリックエリアを置く仕組み -->
    <div id="game-container" style="background-image: url('library.png'); position: relative;">
        
        <!-- 本棚の上に被せる透明なボタン -->
        <div id="click-bookshelf" style="
            position: absolute; 
            top: 200px; 
            left: 500px; 
            width: 150px; 
            height: 200px; 
            cursor: pointer; 
            background-color: rgba(255,0,0,0.5); 開発中は色をつけて場所を確認し、本番で透明にする 
        "></div>
    
    </div>
    
    <script src="script.js"></script>
</body>
</html>
